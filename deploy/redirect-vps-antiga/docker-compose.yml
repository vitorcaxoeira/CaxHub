# Sobe em /opt/caxhub-redirect na VPS antiga (179.197.67.226) SÓ depois que o CaxHub antigo for parado
# (`docker compose stop` em /opt/CaxHub), porque ocupa a mesma porta 8080. Favoritos e o CaxHub Desktop
# antigo continuam chegando no endereço novo. Para voltar atrás: `docker compose down` aqui e
# `docker compose start` em /opt/CaxHub.
services:
  redirect:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 32m
