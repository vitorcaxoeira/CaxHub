# Só na VPS com Traefik na frente (montado por deploy/compose.vps.yml em conf.d/00-realip.conf).
# Sem isso o $remote_addr do nginx é o IP do container do Traefik e o `x-real-ip` que o backend grava
# como evidência (atividades.ts, ipDoCliente) deixa de ser o do usuário. O Traefik é a borda: ele
# SOBRESCREVE o X-Forwarded-For com o IP de quem conectou, então o valor não é forjável de fora.
# Confia só em faixas de rede interna do Docker; não vai na VPS antiga, que não tem proxy na frente.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
