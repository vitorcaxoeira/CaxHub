# Acesso de emergência: o "Terminal do navegador" do hPanel da Hostinger entra por SSH como root,
# a partir do endereço interno 169.254.0.1 (link-local, não roteável pela internet). Sem esta
# exceção, o `AllowUsers deploy` do 00-hardening.conf o recusa.
#
# Vale SÓ para conexões vindas desse endereço; de qualquer outro (o seu IP, a internet) root
# continua recusado. O console autentica por CHAVE, então a senha continua desligada também aqui.
#
# Instalado em /etc/ssh/sshd_config.d/99-console-hostinger.conf. Precisa ser o ÚLTIMO arquivo
# lido: um bloco Match vale até o fim do arquivo, e o prefixo 99 garante que nada depois dele.
Match Address 169.254.0.1
    PermitRootLogin prohibit-password
