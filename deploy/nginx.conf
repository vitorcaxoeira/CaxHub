server {
    listen 80;

    # O padrão do nginx é 1 MB e barrava upload antes de chegar no backend (limites de 10 MB nas
    # fotos do 5S e 20 MB nos anexos de atividade/viagem). 25 MB cobre o maior deles.
    client_max_body_size 25m;

    # Compressão das respostas de texto. O nginx só comprime text/html por padrão; o JSON da API (a lista de
    # Atividades chega a ~600 KB, ~4 MB para admin) e o JS/CSS do app iam crus. Imagens, PDFs e .exe já são
    # binários comprimidos, então ficam de fora.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Geração de PDF (Chromium headless no backend) pode passar do timeout padrão de 60 s quando o
    # relatório tem muitas fotos.
    location /api/5s/relatorio/ {
        proxy_pass http://backend:3001/5s/relatorio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Instalador do CaxHub Desktop. Sem esta rota o `try_files` do SPA devolveria o index.html
    # (200, HTML) no lugar de um .exe ausente, e o navegador baixaria uma página como se fosse o
    # instalador. `=404` evita isso.
    location /downloads/ {
        alias /srv/downloads/;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
