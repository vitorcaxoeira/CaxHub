server {
    listen 80;

    # O padrão do nginx é 1 MB e barrava upload antes de chegar no backend (limite de 10 MB nas
    # fotos do 5S e 20 MB nos anexos de atividade). 25 MB cobre o maior deles.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
