# Endurecimento do SSH da VPS do CaxHub (Soeltech): SOMENTE chave pública, sem senha e sem root.
# Instalado em /etc/ssh/sshd_config.d/00-hardening.conf. O prefixo `00-` importa: o sshd usa o
# PRIMEIRO valor que lê de cada diretiva, e no Ubuntu o `50-cloud-init.conf` pode reabilitar senha.
#
# Só aplicar depois de provar o login como `deploy` com a chave, numa 2ª sessão.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# root só a partir do endereço interno da Hostinger (console web do hPanel); ver
# sshd-console-hostinger.conf. De qualquer outro endereço, só o deploy entra.
AllowUsers deploy root@169.254.0.1
MaxAuthTries 3
LoginGraceTime 120
X11Forwarding no
AllowAgentForwarding no
