[package]
name = "caxhub-desktop"
version = "0.1.0"
description = "Janela flutuante do CaxHub"
edition = "2021"

[lib]
name = "caxhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Instalador pequeno: é o que o usuário baixa.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
